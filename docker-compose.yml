services:
  db:
    image: mysql:8.0
    container_name: newsverifier-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: postgres123
      MYSQL_DATABASE: newsverifier
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppostgres123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: newsverifier-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: News Verifier API
      DEBUG: "false"
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      DATABASE_URL: mysql+aiomysql://root:postgres123@db:3306/newsverifier
      CHROMA_HOST: localhost
      CHROMA_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/chroma_db:/app/chroma_db

  frontend:
    build: ./frontend
    container_name: newsverifier-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mysql_data: